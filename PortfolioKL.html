<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 20, 20);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        //แสง
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(10, 10, 10);
        scene.add(directionalLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const sunUniforms = {
            uTime: { value: 0.0 },
            uLightDir: { value: new THREE.Vector3(1.0, 1.0, 1.0).normalize() },
            uColor: { value: new THREE.Color(0xffaa00) }
        };

        // vertex shader ของดวงอาทิตย์
        const sunVertexShader = `
            uniform float uTime;
            varying vec3 vNormal;

            void main() {
                vNormal = normal;
                vec3 pos = position;

                float displacement = sin(pos.x * 5.0 + uTime * 3.0) * sin(pos.y * 5.0 + uTime * 3.0) * 0.1;
                pos += normal * displacement;

                gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(pos, 1.0);
            }
        `;

        // cel shading ของดวงอาทิตย์
        const sunFragmentShader = `
            precision mediump float;
            uniform vec3 uLightDir;
            uniform vec3 uColor;
            varying vec3 vNormal;

            void main() {
                vec3 N = normalize(vNormal);
                vec3 L = normalize(uLightDir);

                float diffuse = max(dot(N, L), 0.0);
                float ambient = 0.7;

                diffuse = smoothstep(0.4, 0.45, diffuse);

                vec3 finalColor = uColor * (diffuse + ambient);
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // สร้างพระอาทิตย์
        const sunGeo = new THREE.SphereGeometry(1.5, 64, 64);
        const sunMat = new THREE.ShaderMaterial({
            vertexShader: sunVertexShader,
            fragmentShader: sunFragmentShader,
            uniforms: sunUniforms,
            side: THREE.DoubleSide
        });

        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        sunMesh.position.set(-5, 8, -5);
        sunMesh.name = "CartoonSun";
        scene.add(sunMesh);

        let mixer;
        const clock = new THREE.Clock();

        const loader = new THREE.GLTFLoader();
        loader.load("https://kittipat13.github.io/Doremon5.glb", function (gltf) {
            scene.add(gltf.scene);

            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(gltf.scene);
                gltf.animations.forEach((clip) => {
                    mixer.clipAction(clip).play();
                });
            }
        });

        // 3D interaction (Picking)
        const VIEWS = {
            "Text002": { pos: { x: -0.48, y: 1.30, z: 1.48 }, look: { x: -4.78, y: 1.30, z: 1.48 } },
            "Text005": { pos: { x: 1.05, y: 3.29, z: -0.89 }, look: { x: 1.03, y: 2.92, z: -2.23 } },
            "Text003": { pos: { x: 1.15, y: 1.63, z: 2.22 }, look: { x: 4.78, y: 1.63, z: 2.22 } },
        };

        const PORTFOLIO_URL = "https://kittipat13.github.io/";
        const QR_NAMES = ["qrcode"];

        const CAMERA_DURATION = 1.5;

        //interaction คลิกวัตถุ
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function findView(name) {
            const key = Object.keys(VIEWS).find(k => name.includes(k));
            return key ? VIEWS[key] : null;
        }

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            if (intersects.length === 0) return;

            const name = intersects[0].object.name;

            if (QR_NAMES.some(n => name.includes(n))) {
                window.open(PORTFOLIO_URL, "_blank");
                return;
            }

            const view = findView(name);
            if (view) moveCamera(view.pos, view.look);
        });

        function moveCamera(targetPos, targetLook) {
            gsap.killTweensOf(camera.position);
            gsap.killTweensOf(controls.target);
            controls.enabled = false;

            gsap.to(camera.position, {
                x: targetPos.x, y: targetPos.y, z: targetPos.z,
                duration: CAMERA_DURATION, ease: "power2.inOut"
            });

            gsap.to(controls.target, {
                x: targetLook.x, y: targetLook.y, z: targetLook.z,
                duration: CAMERA_DURATION, ease: "power2.inOut",
                onUpdate: () => camera.lookAt(controls.target),
                onComplete: () => { controls.enabled = true; }
            });
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate(time) {
            const delta = clock.getDelta();
            if (mixer) {
                mixer.update(delta);
            }

            // อัปเดตเวลาให้ตัว Vertex Shader ให้แสดงผลแบบ Realtime
            sunUniforms.uTime.value = time * 0.002;
            sunMesh.rotation.y += 0.005;
            sunMesh.rotation.z += 0.002;

            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);
    </script>
</body>
</html>
