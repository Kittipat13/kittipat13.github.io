<!DOCTYPE html>
<html>

<head>
    <title>Lighting</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19"></script>

    <script>
        
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 1, 2);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(3, 5, 3);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const ambientLight = new THREE.AmbientLight(0x606088, 0.6);
        scene.add(ambientLight);
        
        scene.background = new THREE.Color(0xaae8ff);
        
        scene.fog = new THREE.Fog(0xffffff, 5, 10);

        // ===== GUI สำหรับปรับตำแหน่งไฟ =====
        const gui = new lil.GUI();
        const lightFolder = gui.addFolder('Light Position');
        lightFolder.add(directionalLight.position, 'x', -10, 10, 0.1);
        lightFolder.add(directionalLight.position, 'y', 0, 10, 0.1);
        lightFolder.add(directionalLight.position, 'z', -10, 10, 0.1);
        lightFolder.open();

        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
        // แปลงตำแหน่ง mouse เป็นค่า normalized (-1 ถึง 1)
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(plane);

        if (intersects.length > 0) {
            const point = intersects[0].point;
            directionalLight.position.set(point.x, 3, point.z); // ยกสูงจากพื้น 3 หน่วย
        
                
             lightFolder.controllers.forEach(c => c.updateDisplay());
            }
    
        });

        
        // Panoramic 360-degree EXR skybox
        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/venice_sunset_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });
        
        
         const loader = new THREE.GLTFLoader();
         loader.load('https://kittipat13.github.io/MymodelNaja.glb', (gltf) => {
         const model = gltf.scene;
         model.traverse((child) => {
           if (child.isMesh) {
               child.castShadow = true;
               child.receiveShadow = true;
           }
         });
         model.scale.set(0.3, 0.3, 0.3); // ปรับขนาดถ้าโมเดลใหญ่/เล็กเกินไป
         model.position.set(0, 0, 0);
         scene.add(model);
         });



        //ใส่พื้น
        const texFloor = new THREE.TextureLoader().load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg', t => {
        });
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            roughness: 0.85,
            metalness: 0.05
        });
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2; 
        plane.receiveShadow = true;
        scene.add(plane);


        const metalBoxGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const metalBoxMat = new THREE.MeshStandardMaterial({
            color: 0xcccccc,
            metalness: 1.0,
            roughness: 0.1
        });
        const metalBox = new THREE.Mesh(metalBoxGeo, metalBoxMat);
        metalBox.position.set(-1.5, 0.25, 0);
        metalBox.castShadow = true;
        metalBox.receiveShadow = true;
        scene.add(metalBox);

        
        const rubberCylGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.6, 32);
        const rubberCylMat = new THREE.MeshStandardMaterial({
            color: 0xaa3333,
            metalness: 0.0,
            roughness: 0.9
        });
        const rubberCyl = new THREE.Mesh(rubberCylGeo, rubberCylMat);
        rubberCyl.position.set(1.5, 0.3, 0);
        rubberCyl.castShadow = true;
        rubberCyl.receiveShadow = true;
        scene.add(rubberCyl);


        const goldSphereGeo = new THREE.SphereGeometry(0.35, 32, 32);
        const goldSphereMat = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            metalness: 0.8,
            roughness: 0.3
        });
        const goldSphere = new THREE.Mesh(goldSphereGeo, goldSphereMat);
        goldSphere.position.set(0, 0.35, 1.5);
        goldSphere.castShadow = true;
        goldSphere.receiveShadow = true;
        scene.add(goldSphere);


        function animate(t) {
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('keydown', (event) => {

        });

    </script>
</body>

</html>
