<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Paint - Assignment</title>
<style>
    body {
        font-family: "Tahoma", sans-serif;
        background: #e2a93e;
        margin: 0;
        padding: 16px;
    }
    h2 { margin: 0 0 12px 0; }

    
    .workspace {
        display: flex;
        align-items: flex-start;
        gap: 16px;
    }

    .toolbar {
        display: flex;
        flex-direction: column;   /* แถบเครื่องมือแนวนอน */
        align-items: center;
        gap: 8px;
        background: #f2f55f;
        border: 1px solid #ffaf02;
        border-radius: 14px;      /* ทำให้แถบเครื่องมือโค้ง */
        padding: 12px 10px;
        width: fit-content;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    button.tool {
        width: 42px;
        height: 42px;
        font-size: 20px;
        border: none;
        border-radius: 10px;      /* ปุ่มโค้งมน */
        background: #ffffff;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
    }
    button.tool:hover { background: #e8e5dc; }
    button.tool:active { transform: scale(0.94); }
    button.tool.active {
        background: #a6c8ff;
        box-shadow: inset 0 0 0 2px #6699ff;
    }

    .divider {
        width: 100%;
        height: 2px;
        background: linear-gradient(to right, transparent, #b0aca2, transparent);
        margin: 2px 0;
    }

    .control-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 11px;
        gap: 2px;
    }

    input[type="color"] {
        width: 42px;
        height: 28px;
        border: none;
        border-radius: 8px;
        padding: 0;
        cursor: pointer;
    }
    input[type="color"]:disabled { opacity: 0.4; cursor: not-allowed; }

    input[type="range"] { width: 80px; }

    button.action {
        width: 42px;
        min-height: 34px;
        padding: 4px;
        border: none;
        border-radius: 10px;
        background: #ffffff;
        cursor: pointer;
        font-size: 10px;
        line-height: 1.2;
    }
    button.action:hover { background: #e8e5dc; }
    button.action:active { transform: scale(0.96); }

    #canvas {
        display: block;
        border-radius: 12px;      
        border: 1px solid #b0aca2;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        cursor: crosshair;
        background: #fff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .hint {
        font-size: 12px;
        color: #444;
        margin-top: 8px;
        max-width: 500px;
    }
</style>
</head>
<body>

<h2> Mr_KL Paint 🎨</h2>

<div class="workspace">
    <div class="toolbar">
        <button class="tool active" data-tool="pencil" title="ดินสอ">✏️</button>
        <button class="tool" data-tool="line" title="วาดเส้นตรง">📏</button>
        <button class="tool" data-tool="rect" title="วาดสี่เหลี่ยม">⬜</button>
        <button class="tool" data-tool="ellipse" title="วาดวงรี/วงกลม">⚪</button>
        <button class="tool" data-tool="eraser" title="ยางลบ">🧽</button>

        <div class="divider"></div>

        <div class="control-group">
            <label>Color</label>
            <input type="color" id="colorPicker" value="#000000">
        </div>

        <div class="control-group">
            <label>Thick: <span id="sizeLabel">3</span>px</label>
            <input type="range" id="sizeSlider" min="1" max="35" value="3">
        </div>

        <div class="divider"></div>

        <button class="action" id="clearBtn">Clear All</button>
        <button class="action" id="saveBtn">Save Image</button>
    </div>

    <canvas id="canvas" width="200" height="200" style="width:700px; height:500px;"></canvas>
</div>



<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let imageData = ctx.createImageData(W, H);
let data = imageData.data;

// ---------- ฟังก์ชันพื้นฐาน ----------

function fillBackgroundWhite() {
    for (let i = 0; i < data.length; i += 4) {
        data[i] = 255; data[i + 1] = 255; data[i + 2] = 255; data[i + 3] = 255;
    }
}

function putPixel(x, y, r, g, b, a = 255) {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || x >= W || y < 0 || y >= H) return; 
    const index = (y * W + x) * 4;
    data[index] = r;
    data[index + 1] = g;
    data[index + 2] = b;
    data[index + 3] = a;
}

// เส้นบางแบบ 1px 
function drawLine(x1, y1, x2, y2, r, g, b, a = 255) {
    const dx = Math.abs(x2 - x1);
    const dy = Math.abs(y2 - y1);

    if (dx >= dy) {
        const steps = Math.max(dx, 1);
        for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            putPixel(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, r, g, b, a);
        }
    } else {
        const steps = Math.max(dy, 1);
        for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            putPixel(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, r, g, b, a);
        }
    }
}

// หัวแปรง
function stampBrush(x, y, r, g, b, size, a = 255) {
    const radius = size / 2;
    const rInt = Math.ceil(radius);
    for (let dy = -rInt; dy <= rInt; dy++) {
        for (let dx = -rInt; dx <= rInt; dx++) {
            if (dx * dx + dy * dy <= radius * radius) {
                putPixel(x + dx, y + dy, r, g, b, a);
            }
        }
    }
}

// เส้นหนา
function drawThickLine(x1, y1, x2, y2, r, g, b, size, a = 255) {
    const dx = x2 - x1, dy = y2 - y1;
    const steps = Math.max(Math.abs(dx), Math.abs(dy), 1);
    for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        stampBrush(x1 + dx * t, y1 + dy * t, r, g, b, size, a);
    }
}

// สี่เหลี่ยม
function drawRectStroke(x1, y1, x2, y2, r, g, b, size, a = 255) {
    drawThickLine(x1, y1, x2, y1, r, g, b, size, a); // บน
    drawThickLine(x2, y1, x2, y2, r, g, b, size, a); // ขวา
    drawThickLine(x2, y2, x1, y2, r, g, b, size, a); // ล่าง
    drawThickLine(x1, y2, x1, y1, r, g, b, size, a); // ซ้าย
}

// วงกลม/วงรี
// แต่เช็คว่าจุดอยู่ "ในวงนอก" และ "นอกวงใน" เพื่อให้ได้แค่ขอบหนา = size
function drawEllipseStroke(cx, cy, rx, ry, r, g, b, size, a = 255) {
    const half = Math.max(size / 2, 0.5);
    const rxOut = rx + half, ryOut = ry + half;
    const rxIn = Math.max(rx - half, 0.1), ryIn = Math.max(ry - half, 0.1);

    for (let y = -ryOut; y <= ryOut; y++) {
        for (let x = -rxOut; x <= rxOut; x++) {
            const outer = (x * x) / (rxOut * rxOut) + (y * y) / (ryOut * ryOut);
            const inner = (x * x) / (rxIn * rxIn) + (y * y) / (ryIn * ryIn);
            if (outer <= 1 && inner >= 1) {
                putPixel(cx + x, cy + y, r, g, b, a);
            }
        }
    }
}

function render() {
    ctx.putImageData(imageData, 0, 0);
}

function hexToRgb(hex) {
    const v = parseInt(hex.slice(1), 16);
    return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
}

// ---------- state ของแต่ละเครื่องมือ ----------

const toolSettings = {
    pencil:  { color: '#000000', size: 3 },
    line:    { color: '#000000', size: 3 },
    rect:    { color: '#ff0000', size: 2 },
    ellipse: { color: '#0000ff', size: 2 },
    eraser:  { size: 12 } // ยางลบใช้สีขาวเสมอ
};
let currentTool = 'pencil';

const colorPicker = document.getElementById('colorPicker');
const sizeSlider = document.getElementById('sizeSlider');
const sizeLabel = document.getElementById('sizeLabel');

function refreshControlsFromTool() {
    const s = toolSettings[currentTool];
    sizeSlider.value = s.size;
    sizeLabel.textContent = s.size;
    if (currentTool === 'eraser') {
        colorPicker.value = '#ffffff';
        colorPicker.disabled = true;
    } else {
        colorPicker.value = s.color;
        colorPicker.disabled = false;
    }
}

document.querySelectorAll('button.tool').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('button.tool').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
        refreshControlsFromTool();
    });
});

colorPicker.addEventListener('input', () => {
    if (currentTool !== 'eraser') toolSettings[currentTool].color = colorPicker.value;
});

sizeSlider.addEventListener('input', () => {
    toolSettings[currentTool].size = parseInt(sizeSlider.value, 10);
    sizeLabel.textContent = sizeSlider.value;
});

// ---------- mouse handling ----------

function toScaledMouseCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    return {
        x: Math.floor((clientX - rect.left) * scaleX),
        y: Math.floor((clientY - rect.top) * scaleY)
    };
}

let isDrawing = false;
let startX = 0, startY = 0, lastX = 0, lastY = 0;
let snapshot = null; // ใช้ทำ preview ของเส้น/สี่เหลี่ยม/วงรี ระหว่างลาก

canvas.addEventListener('mousedown', (e) => {
    const { x, y } = toScaledMouseCoords(e.clientX, e.clientY);
    isDrawing = true;
    startX = x; startY = y; lastX = x; lastY = y;

    if (currentTool === 'pencil' || currentTool === 'eraser') {
        const { r, g, b } = currentTool === 'eraser'
            ? { r: 255, g: 255, b: 255 }
            : hexToRgb(toolSettings.pencil.color);
        stampBrush(x, y, r, g, b, toolSettings[currentTool].size);
        render();
    } else {
        // เก็บภาพก่อนวาด ไว้ใช้ทำ preview ระหว่างลากเมาส์
        snapshot = data.slice();
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing) return;
    const { x, y } = toScaledMouseCoords(e.clientX, e.clientY);

    if (currentTool === 'pencil' || currentTool === 'eraser') {
        const { r, g, b } = currentTool === 'eraser'
            ? { r: 255, g: 255, b: 255 }
            : hexToRgb(toolSettings.pencil.color);
        drawThickLine(lastX, lastY, x, y, r, g, b, toolSettings[currentTool].size);
        lastX = x; lastY = y;
        render();
    } else {
        // เอาภาพก่อนวาดกลับมา แล้ววาด preview ใหม่ทับ (ไม่ให้ค้างรูปเก่า)
        data.set(snapshot);
        const { r, g, b } = hexToRgb(toolSettings[currentTool].color);
        const size = toolSettings[currentTool].size;

        if (currentTool === 'line') {
            drawThickLine(startX, startY, x, y, r, g, b, size);
        } else if (currentTool === 'rect') {
            drawRectStroke(
                Math.min(startX, x), Math.min(startY, y),
                Math.max(startX, x), Math.max(startY, y),
                r, g, b, size
            );
        } else if (currentTool === 'ellipse') {
            const cx = (startX + x) / 2, cy = (startY + y) / 2;
            const rx = Math.abs(x - startX) / 2, ry = Math.abs(y - startY) / 2;
            drawEllipseStroke(cx, cy, rx, ry, r, g, b, size);
        }
        render();
    }
});

window.addEventListener('mouseup', () => {
    isDrawing = false;
    snapshot = null;
});

// ---------- ปุ่มล้างทั้งหมดและบันทึกรูป ----------

document.getElementById('clearBtn').addEventListener('click', () => {
    fillBackgroundWhite();
    render();
});

document.getElementById('saveBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'my-paint.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
});

// ---------- เริ่มต้น ----------

fillBackgroundWhite();
render();
refreshControlsFromTool();
</script>

</body>
</html>
